<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buku Digital</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 class="judul">Buku Digital</h1>

    <div class="book-container">

        <div class="book" id="book">

            <!-- Halaman kiri -->
            <div class="page page-left">
                <img id="leftPage" src="pages/cover.jpg">
            </div>

            <!-- Halaman kanan -->
            <div class="page page-right">
                <img id="rightPage" src="pages/halaman1.jpg">
            </div>

        </div>

    </div>

    <div class="petunjuk">
        Klik sisi kiri untuk kembali ←
        &nbsp;&nbsp;&nbsp;
        Klik sisi kanan untuk lanjut →
    </div>

    <div class="controls">

        <button id="prevBtn">
            ← Sebelumnya
        </button>

        <span id="pageNumber">
            Halaman 1
        </span>

        <button id="nextBtn">
            Berikutnya →
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
